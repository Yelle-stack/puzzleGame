<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle 100 pièces</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f5f0ff;--bg2:#ffe9e0;--fg:#1d1a2b;--mute:#6b6580;--card:rgba(255,255,255,.7);--solid:#fff;--line:rgba(60,40,120,.2);--a1:#7c4dff;--a2:#ff4d8d;--a3:#ff9f43;--shadow:0 10px 30px rgba(80,50,160,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#120e24;--bg2:#2a1236;--fg:#f3effc;--mute:#a79fc2;--card:rgba(255,255,255,.07);--solid:#1d1833;--line:rgba(255,255,255,.16);--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#120e24;--bg2:#2a1236;--fg:#f3effc;--mute:#a79fc2;--card:rgba(255,255,255,.07);--solid:#1d1833;--line:rgba(255,255,255,.16);--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;color:var(--fg);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800;text-align:center;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:2px 0 14px;color:var(--mute);font-size:.85rem;text-align:center}
.stats{display:flex;gap:10px;justify-content:center}
.stat{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:6px 16px;text-align:center;min-width:92px;box-shadow:var(--shadow)}
.stat small{display:block;color:var(--mute);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em}
.stat b{font-size:1.15rem}
#bar{height:6px;border-radius:9px;background:var(--line);margin:12px 0;overflow:hidden;max-width:100%}
#pb{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));transition:width .3s}
svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;height:auto;max-width:100%;max-height:max(calc(100vh - 300px),520px);max-height:max(calc(100dvh - 300px),520px)}
.bd{fill:var(--card);stroke:var(--line)}
.tr{fill:rgba(128,128,128,.08);stroke:var(--line);stroke-dasharray:6 6}
.pc{cursor:grab}
.pc.lift{filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.done{cursor:default}
.done>path{stroke:rgba(0,0,0,.12)}
.fresh{animation:glow .5s}
@keyframes glow{0%{filter:brightness(1.9) saturate(1.5)}100%{filter:none}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;justify-content:center;align-items:center}
button,label.btn{font:inherit;font-weight:500;font-size:.9rem;background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--fg);border:1px solid var(--line);padding:9px 16px;border-radius:12px;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover,label.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
button.primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0}
button.tg.on{background:var(--solid);border-color:var(--a1);color:var(--a1)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;box-shadow:none}
.seg button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.help{font-size:.8rem;color:var(--mute);text-align:center;max-width:520px;margin:6px 0 0}
#win{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,5,30,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:20}
#win.show{display:grid}
.card{background:var(--solid);border-radius:22px;padding:28px 34px;text-align:center;box-shadow:var(--shadow);animation:pop .4s;max-width:90vw}
.card .big{font-size:3rem}
.card h2{margin:4px 0;font-size:1.6rem;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{color:var(--mute);margin:6px 0 16px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:30;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.scroll-nav{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px;z-index:15}
.scroll-nav button{width:42px;height:42px;padding:0;border-radius:50%;font-size:1rem;line-height:1;display:grid;place-items:center;background:var(--solid);box-shadow:var(--shadow);transition:opacity .2s;animation:nudge 1.6s ease-in-out 3}
.scroll-nav button.hide{opacity:0;pointer-events:none}
@keyframes nudge{50%{margin-top:-5px}}
@media (max-width:900px){.scroll-nav{display:flex}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.fresh{animation:none}.scroll-nav button{animation:none}}
@media (max-width:600px){
  body{padding:12px 8px}
  .stat{min-width:78px;padding:5px 10px}
  button,label.btn{padding:8px 12px;font-size:.85rem}
  .seg button{padding:6px 10px}
}
</style>
</head>
<body>
<h1>🧩 Puzzle <span id="count">100</span> pièces</h1>
<p class="sub">Glisse, tourne, assemble</p>
<div class="stats">
  <div class="stat"><small>Temps</small><b id="time">0:00</b></div>
  <div class="stat"><small>Placées</small><b><span id="placed">0</span>/<span id="total">100</span></b></div>
  <div class="stat"><small>Record</small><b id="best">–</b></div>
</div>
<div id="bar"><i id="pb"></i></div>
<svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="btns"><div class="seg" id="sizes"></div></div>
<div class="btns">
  <button id="shuffle" class="primary">🔀 Nouvelle partie</button>
  <button id="rot" class="tg on">🔄 Rotation</button>
  <button id="guide" class="tg on">👁️ Guide</button>
  <label class="btn">🖼️ Ma photo<input id="file" type="file" accept="image/*" hidden></label>
</div>
<p class="help">Glisse chaque pièce à sa place. Touche une pièce sans la déplacer pour la faire pivoter. Bien placée et dans le bon sens, elle se verrouille toute seule.</p>
<div class="scroll-nav">
  <button id="up" class="hide" aria-label="Monter">▲</button>
  <button id="down" aria-label="Descendre">▼</button>
</div>
<div id="win"><div class="card"><div class="big">🎉</div><h2>Bravo !</h2><p id="winTxt"></p><button class="primary" id="again">Rejouer</button></div></div>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',svg=$('svg'),S=600,B=20;
let n=innerWidth<600?5:10,c=60,rotOn=true,guideOn=true,imgURL='',H,V,placed=0,t0=0,timer=null,over=false,drag=null,gLoose,gLocked,VW,VH,ghost,lastLand;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const stopT=()=>{clearInterval(timer);timer=null};
const key=()=>'jig-'+n+(rotOn?'r':'n');

function drawDefault(cv){
  const x=cv.getContext('2d'),W=cv.width;
  const g=x.createLinearGradient(0,0,0,W);
  g.addColorStop(0,'#1f2a6b');g.addColorStop(.4,'#b5457a');g.addColorStop(.62,'#ff8a4c');g.addColorStop(.75,'#ffd27a');g.addColorStop(1,'#2a6f8f');
  x.fillStyle=g;x.fillRect(0,0,W,W);
  x.fillStyle='#fff';
  for(let i=0;i<90;i++){x.globalAlpha=Math.random()*.9;x.beginPath();x.arc(Math.random()*W,Math.random()*W*.4,Math.random()*2.5+.5,0,7);x.fill()}
  x.globalAlpha=1;x.fillStyle='#fff3b0';x.beginPath();x.arc(W*.65,W*.55,W*.1,0,7);x.fill();
  const m=(col,p)=>{x.fillStyle=col;x.beginPath();x.moveTo(0,W*.78);p.forEach(q=>x.lineTo(q[0]*W,q[1]*W));x.lineTo(W,W*.78);x.fill()};
  m('#7a3f8a',[[0,.66],[.15,.48],[.3,.64],[.5,.42],[.7,.62],[.85,.5],[1,.6]]);
  m('#43245f',[[0,.74],[.2,.6],[.45,.72],[.7,.58],[1,.72]]);
  x.fillStyle='#16324a';x.fillRect(0,W*.78,W,W*.22);
  for(let i=0;i<60;i++){x.fillStyle=`hsla(${Math.random()*60+10},90%,65%,.5)`;x.fillRect(Math.random()*W,W*.78+Math.random()*W*.22,Math.random()*90+20,3)}
  for(let i=0;i<45;i++){x.fillStyle=`hsla(${Math.random()*360},85%,60%,.55)`;x.beginPath();x.arc(Math.random()*W,Math.random()*W,Math.random()*22+6,0,7);x.fill()}
}
function setImage(u){imgURL=u;build()}

function edge(x0,y0,x1,y1,nx,ny,s){
  if(!s)return `L${x1} ${y1}`;
  const dx=x1-x0,dy=y1-y0;
  const P=(t,h)=>`${(x0+dx*t+nx*h*c*s).toFixed(1)} ${(y0+dy*t+ny*h*c*s).toFixed(1)}`;
  return `L${P(.38,0)}C${P(.38,.08)} ${P(.32,.12)} ${P(.32,.2)}C${P(.32,.32)} ${P(.68,.32)} ${P(.68,.2)}C${P(.68,.12)} ${P(.62,.08)} ${P(.62,0)}L${x1} ${y1}`;
}
function pathFor(r,k){
  return `M0 0${edge(0,0,c,0,0,-1,-H[r][k])}${edge(c,0,c,c,1,0,V[r][k+1])}${edge(c,c,0,c,0,1,H[r+1][k])}${edge(0,c,0,0,-1,0,-V[r][k])}Z`;
}
const setT=p=>p.g.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${p.rot} ${c/2} ${c/2})`);

function showBest(){
  try{const b=localStorage.getItem(key());$('best').textContent=b?fmt(+b):'–'}catch(e){$('best').textContent='–'}
}
function build(){
  stopT();over=false;placed=0;drag=null;c=S/n;
  $('win').classList.remove('show');$('pb').style.width='0';
  $('time').textContent='0:00';$('placed').textContent=0;
  $('total').textContent=n*n;$('count').textContent=n*n;showBest();
  svg.innerHTML='';
  H=Array.from({length:n+1},(_,r)=>Array.from({length:n},()=>r===0||r===n?0:Math.random()<.5?1:-1));
  V=Array.from({length:n},()=>Array.from({length:n+1},(_,k)=>k===0||k===n?0:Math.random()<.5?1:-1));
  const land=innerWidth>=innerHeight*1.1,tw=land?520:S,th=land?S:480;
  lastLand=land;
  VW=land?3*B+S+tw:S+2*B;VH=land?S+2*B:3*B+S+th;
  const tx=land?2*B+S:B,ty=land?B:2*B+S;
  svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  svg.style.width=land?'min(97vw,1100px)':'min(94vw,520px)';
  $('bar').style.width=svg.style.width;
  const defs=el('defs',{},svg);
  el('image',{id:'im',href:imgURL,width:S,height:S,preserveAspectRatio:'xMidYMid slice'},defs);
  el('rect',{class:'tr',x:tx,y:ty,width:tw,height:th,rx:14},svg);
  el('rect',{class:'bd',x:B,y:B,width:S,height:S,rx:8},svg);
  ghost=el('use',{href:'#im',x:B,y:B,opacity:guideOn?.18:0},svg);
  gLocked=el('g',{},svg);gLoose=el('g',{},svg);
  const cols=Math.ceil(Math.sqrt(n*n*tw/th)),rows=Math.ceil(n*n/cols),mg=.35*c;
  const cells=[...Array(cols*rows).keys()].sort(()=>Math.random()-.5);
  for(let i=0;i<n*n;i++){
    const r=Math.floor(i/n),k=i%n,d=pathFor(r,k),g=el('g',{class:'pc'},gLoose);
    const cp=el('clipPath',{id:'cp'+i},defs);el('path',{d},cp);
    const cg=el('g',{'clip-path':`url(#cp${i})`},g);
    el('use',{href:'#im',x:-k*c,y:-r*c},cg);
    el('path',{d,fill:'none',stroke:'rgba(0,0,0,.45)','stroke-width':1.2},g);
    const q=cells[i],cx=q%cols,cy=Math.floor(q/cols);
    const p={g,r,col:k,done:false,rot:rotOn?90*Math.floor(Math.random()*4):0};
    p.x=tx+mg+(cols>1?cx/(cols-1):.5)*(tw-c-2*mg)+(Math.random()-.5)*8;
    p.y=ty+mg+(rows>1?cy/(rows-1):.5)*(th-c-2*mg)+(Math.random()-.5)*8;
    g._p=p;setT(p);
  }
}

function confetti(){
  for(let i=0;i<80;i++){
    const d=document.createElement('div');d.className='cf';
    d.style.left=Math.random()*100+'vw';
    d.style.background=`hsl(${Math.random()*360},85%,60%)`;
    d.style.animationDuration=2+Math.random()*2.5+'s';
    d.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),6000);
  }
}
function pt(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())}
function trySnap(p){
  const X=B+p.col*c,Y=B+p.r*c;
  if(p.rot%360!==0||Math.hypot(p.x-X,p.y-Y)>c*.35)return;
  p.x=X;p.y=Y;setT(p);p.done=true;p.g.setAttribute('class','pc done fresh');gLocked.appendChild(p.g);
  $('placed').textContent=++placed;
  $('pb').style.width=placed*100/(n*n)+'%';
  if(placed===n*n)win();
}
function win(){
  over=true;stopT();const t=Date.now()-t0;let rec='';
  try{const b=localStorage.getItem(key());if(!b||t<+b){rec=' Nouveau record ! 🏆';localStorage.setItem(key(),t)}}catch(e){}
  $('winTxt').textContent='Puzzle terminé en '+fmt(t)+'.'+rec;
  showBest();$('win').classList.add('show');confetti();
}
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('g.pc');if(!g||over)return;
  const p=g._p;if(p.done)return;
  e.preventDefault();gLoose.appendChild(g);g.classList.add('lift');
  const q=pt(e);drag={p,dx:q.x-p.x,dy:q.y-p.y,sx:e.clientX,sy:e.clientY,moved:false};
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5)drag.moved=true;
  if(!drag.moved)return;
  if(!timer&&!over){t0=Date.now();timer=setInterval(()=>{$('time').textContent=fmt(Date.now()-t0)},250)}
  const q=pt(e),p=drag.p;
  p.x=Math.max(-.2*c,Math.min(VW-.8*c,q.x-drag.dx));
  p.y=Math.max(-.2*c,Math.min(VH-.8*c,q.y-drag.dy));
  setT(p);
});
svg.addEventListener('pointerup',()=>{
  if(!drag)return;const p=drag.p;
  p.g.classList.remove('lift');
  if(drag.moved)trySnap(p);
  else if(rotOn){
    if(!timer&&!over){t0=Date.now();timer=setInterval(()=>{$('time').textContent=fmt(Date.now()-t0)},250)}
    p.rot=(p.rot+90)%360;setT(p);trySnap(p);
  }
  drag=null;
});
svg.addEventListener('pointercancel',()=>{if(drag)drag.p.g.classList.remove('lift');drag=null});

[[5,'25'],[8,'64'],[10,'100']].forEach(([s,l])=>{
  const b=document.createElement('button');b.textContent=l+' pièces';b.dataset.n=s;
  b.onclick=()=>{n=s;document.querySelectorAll('#sizes button').forEach(x=>x.classList.toggle('on',+x.dataset.n===n));build()};
  $('sizes').appendChild(b);
});
document.querySelector('#sizes button[data-n="'+n+'"]').classList.add('on');
$('shuffle').onclick=build;
$('again').onclick=build;
$('win').onclick=e=>{if(e.target.id==='win')$('win').classList.remove('show')};
$('rot').onclick=()=>{rotOn=!rotOn;$('rot').classList.toggle('on',rotOn);build()};
$('guide').onclick=()=>{guideOn=!guideOn;$('guide').classList.toggle('on',guideOn);ghost.setAttribute('opacity',guideOn?.18:0)};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const i=new Image();
    i.onload=()=>{
      const cv=document.createElement('canvas');cv.width=cv.height=1000;
      const s=Math.min(i.width,i.height);
      cv.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,1000,1000);
      setImage(cv.toDataURL('image/jpeg',.9));
    };
    i.src=r.result;
  };
  r.readAsDataURL(f);
};
addEventListener('resize',()=>{
  const land=innerWidth>=innerHeight*1.1;
  if(land!==lastLand&&!timer&&!placed)build();
});
const upB=$('up'),dnB=$('down');
function updNav(){
  const max=document.documentElement.scrollHeight-innerHeight;
  upB.classList.toggle('hide',scrollY<20);
  dnB.classList.toggle('hide',scrollY>max-20||max<40);
}
addEventListener('scroll',updNav,{passive:true});
addEventListener('resize',updNav);
new ResizeObserver(updNav).observe(document.body);
upB.onclick=()=>scrollBy({top:-innerHeight*.4,behavior:'smooth'});
dnB.onclick=()=>scrollBy({top:innerHeight*.4,behavior:'smooth'});
updNav();
const c0=document.createElement('canvas');c0.width=c0.height=1000;drawDefault(c0);
setImage(c0.toDataURL('image/jpeg',.9));
</script>
</body>
</html>
